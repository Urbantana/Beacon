kind = "web"
previewPath = "/"
title = "Urban Up"
version = "1.0.0"
id = "artifacts/urban-up"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20249

[services.development]
run = "pnpm --filter @workspace/urban-up run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/urban-up", "run", "build" ]
serve = "static"
publicDir = "artifacts/urban-up/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20249"
BASE_PATH = "/"
